model:
  model_source: "LTXV_2B_0.9.6_DISTILLED"
  training_mode: "lora"
  load_checkpoint: null

lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"

conditioning:
  mode: "none"
  first_frame_conditioning_p: 1.0

optimization:
  learning_rate: 5e-5
  steps: 50
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: "adamw8bit"
  scheduler_type: "constant"
  scheduler_params: {}
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: null
  load_text_encoder_in_8bit: false
  compile_with_inductor: false
  compilation_mode: "reduce-overhead"

data:
  preprocessed_data_root: "/workspace/experiments/wan_ticft/ltx_lora_bdd_smoke20/.precomputed"
  num_dataloader_workers: 2

validation:
  prompts:
    - "Continue the observed forward-facing driving camera video with realistic ego motion and consistent traffic."
  negative_prompt: "blurry, jittery, distorted, inconsistent geometry"
  images: null
  video_dims: [512, 288, 121]
  seed: 42
  inference_steps: 8
  interval: null
  videos_per_prompt: 1
  guidance_scale: 1.0

checkpoints:
  interval: 25
  keep_last_n: 2

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

hub:
  push_to_hub: false
  hub_model_id: null

wandb:
  enabled: false
  project: "ltxv-trainer"
  entity: null
  tags: []
  log_validation_videos: false

seed: 42
output_dir: "/workspace/experiments/wan_ticft/ltx_lora_bdd_smoke20_output"
