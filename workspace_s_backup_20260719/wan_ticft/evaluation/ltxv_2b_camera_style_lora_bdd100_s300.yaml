model:
  model_source: "LTXV_2B_0.9.6_DISTILLED"
  training_mode: "lora"
  load_checkpoint: null

lora:
  rank: 8
  alpha: 8
  dropout: 0.0
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"

conditioning:
  mode: "none"
  first_frame_conditioning_p: 1.0

optimization:
  learning_rate: 1e-5
  steps: 300
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: "adamw8bit"
  scheduler_type: "constant"
  scheduler_params: {}
  enable_gradient_checkpointing: true

acceleration:
  mixed_precision_mode: "bf16"
  quantization: null
  load_text_encoder_in_8bit: false
  compile_with_inductor: false
  compilation_mode: "reduce-overhead"

data:
  preprocessed_data_root: "/workspace/experiments/wan_ticft/ltx2b_camera_style_lora_bdd100/.precomputed"
  num_dataloader_workers: 2

validation:
  prompts:
    - "Exact dashcam continuation from the final observed frame. Preserve the same road geometry, camera viewpoint, lighting, colors, compression texture, vehicles, pedestrians, shadows, and natural traffic-camera realism."
  negative_prompt: "synthetic texture, cartoon, cinematic grading, over-smoothed road, fake building facade, blurry, jittery, distorted, inconsistent geometry"
  images: null
  video_dims: [512, 288, 121]
  seed: 42
  inference_steps: 8
  interval: 100
  videos_per_prompt: 1
  guidance_scale: 1.0

checkpoints:
  interval: 100
  keep_last_n: 3

flow_matching:
  timestep_sampling_mode: "shifted_logit_normal"
  timestep_sampling_params: {}

hub:
  push_to_hub: false
  hub_model_id: null

wandb:
  enabled: false
  project: "ltxv-trainer"
  entity: null
  tags: []
  log_validation_videos: false

seed: 42
output_dir: "/workspace/experiments/wan_ticft/ltx2b_camera_style_lora_bdd100_output"
